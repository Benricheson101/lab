- name: Install packages
  dnf:
    name:
      - mono-devel
      - libicu
    state: present

- name: Create sonarr group
  group:
    name: sonarr
    system: true
    state: present

- name: Create sonarr user
  user:
    name: sonarr
    group: sonarr
    home: /opt/sonarr
    system: true
    state: present

- name: Downlaod sonarr executable
  unarchive:
    src: https://services.sonarr.tv/v1/download/main/latest?version=4&os=linux&arch=x64
    dest: /opt/sonarr
    remote_src: yes

- name: Make sonarr config directory
  file:
    name: /opt/sonarr/.config/Sonarr
    owner: sonarr
    group: sonarr
    mode: '0700'
    state: directory
    recurse: true

- name: Check if config file exists
  stat:
    path: /opt/sonarr/.config/Sonarr/config.xml
  register: cfg_stat

- name: Copy sonarr config
  template:
    src: config.xml.j2
    dest: /opt/sonarr/.config/Sonarr/config.xml
    owner: sonarr
    group: sonarr
    mode: '0600'
  when: not cfg_stat.stat.exists

- name: Update port in config file
  lineinfile:
    path: /opt/sonarr/.config/Sonarr/config.xml
    regexp: '<Port>'
    line: '<Port>{{sonarr_port}}</Port>'
    insertafter: '<Config>'
    state: present

- name: Create systemd unit file
  template:
    src: sonarr.service.j2
    dest: /etc/systemd/system/sonarr.service
    owner: root
    group: root

- name: Start sonarr
  service:
    name: sonarr
    state: started
    enabled: true
    daemon_reload: true
