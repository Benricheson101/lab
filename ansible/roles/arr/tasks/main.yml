- name: Install packages
  dnf:
    name:
      - mono-devel
      - libicu
    state: present

- name: Create {{service_name}} group
  group:
    name: '{{service_name}}'
    system: true
    state: present

- name: Create {{service_name}} user
  user:
    name: '{{service_name}}'
    group: '{{service_name}}'
    home: /opt/{{service_name}}
    system: true
    state: present

- name: Downlaod {{service_name}} executable
  unarchive:
    src: '{{download_url}}'
    dest: /opt/{{service_name}}
    remote_src: yes

- name: Make {{service_name}} config directory
  file:
    name: /opt/{{service_name}}/.config/{{service_name | capitalize}}
    owner: '{{service_name}}'
    group: '{{service_name}}'
    mode: '0700'
    state: directory
    recurse: true

- name: Check if config file exists
  stat:
    path: /opt/{{service_name}}/.config/{{service_name}}/config.xml
  register: cfg_stat

- name: Copy {{service_name}} config
  template:
    src: config.xml.j2
    dest: /opt/{{service_name}}/.config/{{service_name}}/config.xml
    owner: '{{service_name}}'
    group: '{{service_name}}'
    mode: '0600'
  when: not cfg_stat.stat.exists

- name: Update port in config file
  lineinfile:
    path: /opt/{{service_name}}/.config/{{service_name | capitalize}}/config.xml
    regexp: '<Port>'
    line: '<Port>{{service_port}}</Port>'
    insertafter: '<Config>'
    state: present

- name: Create systemd unit file
  template:
    src: 'arr.service.j2'
    dest: /etc/systemd/system/{{service_name}}.service
    owner: root
    group: root
  register: svc_unit

- name: Reload systemd
  service:
    daemon_reload: true
  when: svc_unit.changed

- name: Start {{service_name}}
  service:
    name: '{{service_name}}'
    state: started
    enabled: true
